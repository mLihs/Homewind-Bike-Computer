name: Karoo 3

# Every push to main builds and tests the APK.
# When versionName in karoo3/app/build.gradle.kts is new (no tag karoo3-v<version> yet),
# the push also creates that tag and a GitHub release with the APK.
# So: bump versionName (and versionCode) → push → release.

on:
  push:
    branches: [main]
    paths:
      - "karoo3/**"
      - ".github/workflows/karoo3.yml"
  pull_request:
    paths:
      - "karoo3/**"
      - ".github/workflows/karoo3.yml"
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

concurrency:
  group: karoo3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: karoo3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # karoo-ext is only on GitHub Packages; build it from source into mavenLocal instead (no token needed).
      - name: karoo-ext 1.1.9 to mavenLocal
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch 1.1.9 https://github.com/hammerheadnav/karoo-ext
          cd karoo-ext
          ./gradlew --no-daemon :lib:publishToMavenLocal

      - name: Version
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=karoo3-v$name" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/karoo3-v$name" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Karoo 3 version $name ($code)"
          IFS=. read -r major minor patch <<< "$name"
          expected=$((major * 10000 + minor * 100 + patch))
          if [ "$code" != "$expected" ]; then
            echo "::error::versionCode $code does not match versionName $name (expected $expected = major*10000 + minor*100 + patch)"
            exit 1
          fi

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KAROO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/homewind.jks"
            echo "file=$RUNNER_TEMP/homewind.jks" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KAROO_KEYSTORE_BASE64 secret: shipping the debug build. Its key changes per runner, so updates need an uninstall first."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests and APK
        env:
          KAROO_KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          KAROO_KEYSTORE_PASSWORD: ${{ secrets.KAROO_KEYSTORE_PASSWORD }}
          KAROO_KEY_ALIAS: ${{ secrets.KAROO_KEY_ALIAS }}
          KAROO_KEY_PASSWORD: ${{ secrets.KAROO_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.variant }}" = "release" ]; then
            ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "homewind-karoo3-v${{ steps.version.outputs.name }}.apk"
          else
            ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "homewind-karoo3-v${{ steps.version.outputs.name }}.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: homewind-karoo3-v${{ steps.version.outputs.name }}
          path: karoo3/homewind-karoo3-v${{ steps.version.outputs.name }}.apk

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Karoo 3 v${{ steps.version.outputs.name }}
          generate_release_notes: true
          make_latest: true
          body: |
            Homewind for Hammerhead Karoo 3, version ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }}).
            Build: ${{ steps.signing.outputs.variant }}. Install the APK on the Karoo (Companion app sideload or `adb install -r`).
          files: karoo3/homewind-karoo3-v${{ steps.version.outputs.name }}.apk

      # Update channel for the Karoo: AndroidManifest.xml points to
      # releases/download/karoo3-latest/manifest.json (a fixed release, so a later
      # Garmin release cannot become "latest" for the Karoo).
      - name: Update manifest (karoo3-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true' && steps.signing.outputs.variant == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          name, code, tag, repo = os.environ["NAME"], int(os.environ["CODE"]), os.environ["TAG"], os.environ["REPO"]
          manifest = {
              "label": "Homewind",
              "packageName": "io.homewind.karoo",
              "latestApkUrl": f"https://github.com/{repo}/releases/download/{tag}/homewind-karoo3-v{name}.apk",
              "latestVersion": name,
              "latestVersionCode": code,
              "developer": "Martin Lihs",
              "description": "Homewind fan control on the Karoo: fan speed, mode, sensors and graphs; plus, minus and mode on AXS buttons.",
              "releaseNotes": f"https://github.com/{repo}/releases/tag/{tag}",
              "tags": ["performance"],
          }
          json.dump(manifest, open("manifest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release view karoo3-latest --repo "$REPO" > /dev/null 2>&1 || \
            gh release create karoo3-latest --repo "$REPO" --title "Karoo 3 update channel" \
              --notes "manifest.json for the Karoo's update check. Not a version; see the karoo3-v* releases." \
              --prerelease --latest=false
          gh release upload karoo3-latest manifest.json --repo "$REPO" --clobber
