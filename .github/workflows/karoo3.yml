name: Karoo 3

on:
  push:
    branches: [main]
    tags: ["karoo3-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the APK to a release on karoo3-v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: karoo3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # karoo-ext is only on GitHub Packages; build it from source into mavenLocal instead (no token needed).
      - name: karoo-ext 1.1.9 to mavenLocal
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch 1.1.9 https://github.com/hammerheadnav/karoo-ext
          cd karoo-ext
          ./gradlew --no-daemon :lib:publishToMavenLocal

      - name: Unit tests and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk homewind-karoo3-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: homewind-karoo3-apk
          path: karoo3/homewind-karoo3-debug.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/karoo3-v')
        uses: softprops/action-gh-release@v2
        with:
          files: karoo3/homewind-karoo3-debug.apk
